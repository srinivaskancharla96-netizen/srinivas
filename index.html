<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kancharla Srinivas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="bg-gradient-to-r from-purple-200 via-pink-100 to-blue-200 min-h-screen flex flex-col items-center justify-center text-center">
  <div class="max-w-2xl bg-white bg-opacity-80 shadow-lg rounded-2xl p-10">
    <h1 class="text-4xl font-bold text-purple-800 mb-4">Kancharla Srinivas</h1>
    <p class="text-lg text-gray-700 mb-6">Welcome to my personal page.</p>
    <p class="text-gray-600 mb-8">This is a simple personal site created as an example. More details can be added here later if desired.</p>

    <!-- 🌐 Social Media Section -->
    <div class="flex justify-center space-x-6 mt-4">
      <!-- Facebook -->
      <a href="https://facebook.com/" target="_blank" class="text-blue-600 hover:scale-110 transition-transform" title="Facebook">
        <i data-lucide="facebook" class="w-8 h-8"></i>
      </a>

      <!-- Instagram -->
      <a href="https://instagram.com/" target="_blank" class="text-pink-500 hover:scale-110 transition-transform" title="Instagram">
        <i data-lucide="instagram" class="w-8 h-8"></i>
      </a>

      <!-- LinkedIn -->
      <a href="https://linkedin.com/" target="_blank" class="text-blue-700 hover:scale-110 transition-transform" title="LinkedIn">
        <i data-lucide="linkedin" class="w-8 h-8"></i>
      </a>

      <!-- YouTube -->
      <a href="https://youtube.com/" target="_blank" class="text-red-600 hover:scale-110 transition-transform" title="YouTube">
        <i data-lucide="youtube" class="w-8 h-8"></i>
      </a>
    </div>
  </div>

  <script>
    lucide.createIcons(); // Initialize icons
  </script>
</body>
</html>
